name: Build Docker release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}

jobs:
  docker:
    name: Build CashewBlog image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: cashewblog:${{ env.RELEASE_TAG }}
          load: ${{ github.event_name != 'pull_request' }}
          push: false
          build-args: |
            VITE_PRIMEUI_LICENSE=${{ secrets.PRIMEUI_LICENSE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image package
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          docker save "cashewblog:${RELEASE_TAG}" | gzip -9 > "cashewblog-${RELEASE_TAG}.tar.gz"
          sha256sum "cashewblog-${RELEASE_TAG}.tar.gz" > "cashewblog-${RELEASE_TAG}.tar.gz.sha256"

      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "cashewblog-${RELEASE_TAG}.tar.gz" \
              "cashewblog-${RELEASE_TAG}.tar.gz.sha256" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "cashewblog-${RELEASE_TAG}.tar.gz" \
              "cashewblog-${RELEASE_TAG}.tar.gz.sha256" \
              --title "CashewBlog ${RELEASE_TAG}" \
              --generate-notes \
              --notes "Docker image package for linux/amd64. Load with: docker load < cashewblog-${RELEASE_TAG}.tar.gz"
          fi
